                  {
                    "type": "text",
                    "text": "Zerlege nie mit der 1: 24 = 1 · 24 ändert nichts, und die 1 ist keine Primzahl. Ein Faktor wie 4, 6 oder 9 ist noch nicht fertig, denn 4 = 2 · 2, 6 = 2 · 3 und 9 = 3 · 3. Du darfst auch mit 24 = 2 · 12 beginnen: Am Ende stehen immer dieselben Primfaktoren, nur in anderer Reihenfolge.",
                  },
                ],
            },
          ],
