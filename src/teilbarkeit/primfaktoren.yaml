{
  "title": "Primzahlen und Primfaktoren",
  "competencies": ["primfaktoren-ggt-kgv"],
  "description": "Zahlen im Faktorbaum in Primfaktoren zerlegen und das Ergebnis mit Potenzen kurz schreiben.",
  "scope": "Zusammengesetzte Zahlen wiederholt in Faktoren größer als 1 zerlegen; am Ende bleiben Primzahlen. Primzahlen größer als 1 haben genau zwei positive Teiler, 1 ist keine Primzahl. Die Zerlegung im Faktorbaum darstellen und gleiche Primfaktoren als Potenz zusammenfassen, zum Beispiel 24 = 2 · 2 · 2 · 3 = 2^3 · 3. Typische Fehler: 1 als Faktor, ein Faktor, der nicht prim ist (4, 6, 9), Exponenten falsch gezählt. ggT und kgV gehören erst zur nächsten Seite.",
  "blocks":
    [
      {
        "type": "section",
        "id": "regel",
        "title": "Zerlegen, bis nur Primzahlen übrig sind",
        "blocks":
          [
            {
              "type": "text",
              "text": "Nach dieser Seite kannst du jede Zahl in Primfaktoren zerlegen, im Faktorbaum aufschreiben und mit Potenzen kurz schreiben. Du brauchst dafür Teiler aus der Seite davor und Potenzen aus dem Rückblick am Kapitelanfang.",
            },
            {
              "type": "text",
              "text": "Du kannst 12 als 3 · 4 schreiben. Die 4 lässt sich weiter zerlegen: 4 = 2 · 2. Bei 12 = 3 · 2 · 2 geht es nicht weiter, wenn alle Faktoren größer als 1 sein sollen.",
            },
          ],
      },
      {
        "type": "section",
        "id": "entdecken",
        "title": "Ausprobieren",
        "blocks":
          [
            {
              "type": "text",
              "text": "Unten zerlegst du eine Zahl Schritt für Schritt. Mit dem Regler wählst du die Zahl. Tippst du auf einen Faktor, dann bietet dir die Anzeige darunter alle Möglichkeiten an, ihn in zwei Faktoren größer als 1 aufzuteilen; jede Möglichkeit steht nur einmal da, denn 3 · 4 und 4 · 3 sind dieselbe Zerlegung. Die neuen Faktoren ersetzen den alten, das Produkt bleibt gleich. Ein Stern ★ bedeutet: Dieser Faktor lässt sich nicht weiter zerlegen. Sind alle Faktoren markiert, schreibt die Anzeige das Ergebnis mit Potenzen. Probiere für dieselbe Zahl verschiedene Wege aus und vergleiche, wo du landest.",
            },
            {
              "type": "vue-component",
              "component": "FaktorEntdecken",
              "props":
                {
                  "numberLabel": "Deine Zahl",
                  "instruction": "Wähle eine Zahl. Tippe dann auf einen Faktor, den du weiter zerlegen möchtest, und wähle eine passende Malaufgabe. Was bleibt am Ende übrig?",
                  "chooseLabel": "Faktor {n} untersuchen",
                  "splitLabel": "So kannst du den gewählten Faktor zerlegen:",
                  "primeLabel": "{n} lässt sich nicht in zwei ganze Faktoren größer als 1 zerlegen. Mit solchen Zahlen endet das Zerlegen.",
                  "finishedLabel": "Jetzt lässt sich keiner der Faktoren weiter zerlegen. Alle sind Primzahlen; die Sterne markieren diese Endpunkte.",
                  "resetLabel": "Noch einmal zerlegen",
                  "powerLabel": "Kurz mit Potenzen:",
                  "powerSpoken": "{base} hoch {exponent}",
                },
              "nojs": "Eine Zahl wird Schritt für Schritt in Faktoren zerlegt, bis keiner der Faktoren mehr in zwei Faktoren größer als 1 zerlegt werden kann. Jede Zerlegung steht nur einmal zur Auswahl: 3 · 4 und 4 · 3 sind dieselbe.\n\nBeispiel: 12 = 3 · 4 = 3 · 2 · 2. Die Faktoren 3, 2 und 2 lassen sich nicht weiter zerlegen. Kurz mit Potenzen: 12 = 2² · 3.",
            },
            {
              "type": "section",
              "id": "primzahlen",
