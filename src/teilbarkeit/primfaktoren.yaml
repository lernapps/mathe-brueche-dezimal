              "source": "eigene Zeichnung",
              "licence": "CC-BY-SA-4.0",
              "alt": "Faktorbaum von 24. Oben steht 24, darunter 4 und 6. Unter der 4 stehen 2 und 2, unter der 6 stehen 2 und 3. Die Primzahlen 2, 2, 2 und 3 am unteren Ende sind ausgefüllt.",
              "caption": "24 = 4 · 6, dann 4 = 2 · 2 und 6 = 2 · 3. Ausgefüllte Kreise sind Primzahlen, die Enden der Äste.",
            },
            {
              "type": "note",
              "title": "Merke",
              "blocks":
