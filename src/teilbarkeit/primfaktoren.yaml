                    "text": "Bei großen Zahlen hilft eine Teilbarkeitsregel für den ersten Schritt: 360 endet auf 0, ist also durch 10 teilbar. Mit 360 = 36 · 10 geht es weiter: 36 = 6 · 6, 6 = 2 · 3 und 10 = 2 · 5.",
