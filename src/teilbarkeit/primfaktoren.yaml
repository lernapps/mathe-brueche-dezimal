              "type": "text",
              "text": "Wenn derselbe Faktor oft vorkommt, wird die Zerlegung lang. Im Faktorbaum von 24 steht die 2 dreimal. Gleiche Faktoren schreibst du als Potenz: Die Basis ist der Faktor, der Exponent zählt, wie oft er vorkommt.",
