                    "type": "figure",
                    "image": "images/faktorbaum-360.svg",
                    "source": "eigene Zeichnung",
                    "licence": "CC-BY-SA-4.0",
                    "alt": "Faktorbaum von 360. Oben steht 360, darunter 36 und 10. Unter der 36 stehen zwei Sechser, unter jeder 6 stehen 2 und 3. Unter der 10 stehen 2 und 5. Die Primzahlen 2, 3, 2, 3, 2 und 5 am Ende der Äste sind ausgefüllt.",
                    "caption": "Am Ende der Äste stehen die Primzahlen 2, 3, 2, 3, 2 und 5.",
                  },
                  {
                    "type": "text",
                    "text": "Zähle, wie oft jeder Primfaktor vorkommt: die 2 dreimal, die 3 zweimal, die 5 einmal.",
