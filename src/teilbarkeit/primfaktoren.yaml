              "blocks":
                [
                  {
                    "type": "definition",
                    "term": "Primzahl",
                    "explanation": "Eine Primzahl ist eine natürliche Zahl größer als 1, die genau zwei positive Teiler hat: 1 und sich selbst. Sie lässt sich nicht in zwei ganze Faktoren größer als 1 zerlegen. Die Zahlen 2, 3, 5, 7, 11, 13 sind Primzahlen. Die 1 ist keine Primzahl, denn sie hat nur einen Teiler.",
                  },
                  {
                    "type": "definition",
                    "term": "Primfaktorzerlegung",
