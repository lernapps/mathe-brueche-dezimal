                  },
                ],
            },
          ],
      },
      {
        "type": "section",
        "id": "faktorbaum",
        "title": "Der Faktorbaum",
        "blocks":
          [
            {
              "type": "text",
              "text": "Damit du bei einer langen Zerlegung nichts übersiehst, zeichnest du den Weg als Faktorbaum. Oben steht die Zahl. Von jeder Zahl, die sich zerlegen lässt, gehen zwei Äste zu den Faktoren. Ein Faktor, der eine Primzahl ist, bekommt keine Äste mehr.",
