                    "type": "text",
                    "text": "Bei großen Zahlen ist das Suchen mühsam. Für einige Teiler verrät dir eine Regel sofort, ob sie passen. Die Quersumme ist die Summe aller Ziffern einer Zahl: 351 hat die Quersumme 3 + 5 + 1 = 9.",
