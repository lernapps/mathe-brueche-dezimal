                        {
                          "type": "text",
                          "text": "Bei 3 und 9 entscheidet die Quersumme, nicht die letzte Ziffer: 703 endet auf 3, aber die Quersumme 10 ist nicht durch 3 teilbar. Bei 4 reicht die letzte Ziffer auch nicht: 14 endet auf 4, ist aber nicht durch 4 teilbar.\n\nBei 2, 5 und 10 genügt die letzte Ziffer, weil 10 durch 2, 5 und 10 teilbar ist. Alle Zehner davor sind dann schon teilbar. Genauso genügen bei 4, 25 und 100 die letzten zwei Ziffern, weil 100 durch 4, 25 und 100 teilbar ist.",
                        },
                      ],
                  },
                ],
            },
