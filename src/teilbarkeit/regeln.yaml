{
  "title": "Teiler, Vielfache und Teilbarkeitsregeln",
  "competencies": ["teilbarkeit"],
  "description": "Teiler und Vielfache finden und mit Teilbarkeitsregeln schnell prüfen, ob eine Zahl teilbar ist.",
  "scope": "Faktor, Produkt, Teiler und Vielfaches an Reihen von Bauklötzen erläutern: Ein Teiler teilt eine Zahl ohne Rest, ein Vielfaches entsteht durch Malnehmen mit 1, 2, 3, … . Alle Teiler einer Zahl als Paare von Malaufgaben finden. Teilbarkeitsregeln für 2, 3, 4, 5, 9, 10, 25 und 100 anwenden: letzte Ziffer, letzte zwei Ziffern, Quersumme. Typische Fehler: bei 3 und 9 nur die letzte Ziffer prüfen, die Quersumme falsch addieren, bei 4 nur die letzte Ziffer ansehen. Primzahlen und Primfaktoren gehören erst zur nächsten Seite.",
  "blocks":
    [
      {
        "type": "section",
        "id": "regel",
        "title": "Zwölf Bauklötze in Reihen",
        "blocks":
          [
            {
              "type": "text",
              "text": "Nach dieser Seite kannst du alle Teiler und Vielfache einer Zahl finden. Mit Teilbarkeitsregeln erkennst du außerdem schnell, ob eine Zahl durch 2, 3, 4, 5, 9, 10, 25 oder 100 teilbar ist. Du brauchst dafür nur das Malnehmen und das Teilen.",
            },
            {
              "type": "text",
              "text": "Zwölf Bauklötze kannst du in gleich lange Reihen legen: eine Reihe mit 12, zwei Reihen mit je 6 oder drei Reihen mit je 4. Jede Anordnung ist eine Malaufgabe.",
            },
            {
              "type": "figure",
              "image": "images/teiler-rechtecke.svg",
              "source": "eigene Zeichnung",
              "licence": "CC-BY-SA-4.0",
              "alt": "Dreimal zwölf gleich große Quadrate. Oben liegen sie in einer Reihe mit 12, in der Mitte in 2 Reihen mit je 6, unten in 3 Reihen mit je 4. Neben jeder Anordnung steht die Malaufgabe.",
              "caption": "Zwölf Klötze, drei Anordnungen: 1 · 12, 2 · 6 und 3 · 4.",
            },
            {
              "type": "definition",
              "term": "Faktor",
              "explanation": "Die Zahlen, die du miteinander multiplizierst, heißen Faktoren. Das Ergebnis heißt Produkt. Bei 3 · 4 = 12 sind 3 und 4 die Faktoren.",
            },
            {
              "type": "definition",
              "term": "Teiler",
              "explanation": "Eine Zahl ist ein Teiler einer anderen, wenn sie diese ohne Rest teilt. 3 ist ein Teiler von 12, denn 12 : 3 = 4 ohne Rest. 5 ist kein Teiler von 12, denn es bleibt der Rest 2.",
            },
            {
              "type": "definition",
              "term": "Vielfaches",
              "explanation": "Ein Vielfaches von 3 entsteht, wenn du 3 mit 1, 2, 3, … malnimmst: 3, 6, 9, 12, … Die 12 ist also ein Vielfaches von 3.",
            },
            {
              "type": "text",
              "text": "Teiler und Vielfache gehören zusammen. Aus 3 · 4 = 12 liest du ab: 3 und 4 sind Teiler von 12, und 12 ist ein Vielfaches von 3 und von 4.",
            },
          ],
      },
