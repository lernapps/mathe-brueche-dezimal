      {
        "type": "section",
        "id": "regel",
        "title": "Was passt zu beiden Zahlen?",
        "blocks":
          [
            {
              "type": "text",
              "text": "Nach dieser Seite kannst du zu zwei Zahlen den größten Teiler und das kleinste Vielfache finden, das beiden gemeinsam ist. Du kannst sie aufschreiben oder aus den Primfaktoren ablesen. Du brauchst dafür Teiler und Vielfache sowie die Primfaktorzerlegung der Seiten davor.",
            },
            {
              "type": "text",
              "text": "Zwei Bilder aus dem Alltag zeigen, wofür das gut ist. **Fliesen:** Du willst eine Wand mit gleich großen, quadratischen Fliesen belegen, ohne eine zu zerschneiden. Welche Seitenlänge ist für beide Wandmaße möglich, und welche ist die größte? **Fahrplan:** Zwei Buslinien fahren zusammen los, die eine alle 12, die andere alle 18 Minuten. Wann fahren beide wieder gleichzeitig ab? Den ggT brauchst du später beim Kürzen von Brüchen, das kgV beim Finden eines gemeinsamen Nenners: Beide Werkzeuge kommen wieder.",
            },
            {
              "type": "definition",
              "term": "ggT",
              "explanation": "Der größte gemeinsame Teiler (ggT) zweier Zahlen ist die größte Zahl, die beide ohne Rest teilt. Die Zahlen 12 und 18 haben die gemeinsamen Teiler 1, 2, 3 und 6, also ist ggT(12, 18) = 6.",
            },
            {
              "type": "definition",
              "term": "kgV",
              "explanation": "Das kleinste gemeinsame Vielfache (kgV) zweier Zahlen ist die kleinste Zahl größer als 0, die in beiden Einmaleinsreihen vorkommt. Bei 4 und 6 sind 12, 24, 36, … gemeinsame Vielfache, also ist kgV(4, 6) = 12.",
            },
          ],
      },
