{
  "title": "ggT und kgV",
  "competencies": ["primfaktoren-ggt-kgv"],
  "description": "Den größten gemeinsamen Teiler und das kleinste gemeinsame Vielfache bestimmen: aus Listen und aus den Primfaktoren.",
  "scope": "Teiler teilen eine Zahl ohne Rest, Vielfache entstehen durch Malnehmen mit 1, 2, 3, … (beides von der Seite Teiler und Vielfache bekannt). Der ggT ist der größte gemeinsame positive Teiler, das kgV das kleinste gemeinsame positive Vielfache. Bestimmen durch Auflisten und aus den Primfaktorzerlegungen: ggT mit den gemeinsamen Primfaktoren und den kleinsten Exponenten, kgV mit allen Primfaktoren und den größten Exponenten. Beispiel 36 = 2^2 · 3^2 und 48 = 2^4 · 3: ggT 12, kgV 144. Alltag: Fahrplan (kgV) und Fliesen (ggT). Beide kehren beim Kürzen (ggT) und beim gemeinsamen Nenner (kgV) wieder; Brüche selbst gehören nicht auf diese Seite. Typische Fehler: Produkt der Zahlen statt kgV, ggT und kgV vertauscht, bei den Primfaktoren die falschen Exponenten.",
