                  { "type": "formula", "formula": "3^2 = 3 \\cdot 3 = 9" },
                  { "type": "formula", "formula": "2^4 = 2 \\cdot 2 \\cdot 2 \\cdot 2 = 16" },
                  { "type": "formula", "formula": "3 \\cdot 3 \\cdot 3 \\cdot 7 \\cdot 7 = 3^3 \\cdot 7^2" },
                  {
                    "type": "text",
                    "text": "Der Exponent sagt nicht, womit du malnimmst, sondern wie oft die Basis als Faktor steht: $2^4$ ist nicht $2 \\cdot 4$.",
                  },
                ],
            },
