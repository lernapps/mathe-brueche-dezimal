# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
{
  "title": "Das brauchst du für dieses Kapitel",
  "description": "Vorrangregeln, Rechengesetze und Potenzen, die du für Teiler und Primfaktoren brauchst: mit Begriffen, Beispielen und Selbsttest.",
  "recap": ["mathematik/grundrechenarten-rechengesetze", "mathematik/potenzen"],
  "scope": "Wiederholung von Vorrangregeln, Rechengesetzen (Vertauschungs-, Verbindungs-, Distributivgesetz) und Potenzen (Basis, Exponent, Zehnerpotenz) als Voraussetzung für Teiler und Primfaktoren, mit Selbsttest.",
  "blocks":
    [
      {
        "type": "text",
        "text": "Für Teiler und Primfaktoren rechnest du viel mit Malaufgaben und mit Potenzen. Unten stehen die Begriffe, die du dafür brauchst, je ein Beispiel und Kurzaufgaben zum Selbsttest. Lies die Rückmeldung: So merkst du, ob du bereit bist.",
      },
      {
        "type": "section",
        "id": "rechengesetze",
        "title": "Vorrangregeln und Rechengesetze",
        "blocks":
          [
            {
              "type": "definition",
              "term": "Vorrangregel",
              "explanation": "Die **Vorrangregel** sagt, was du zuerst rechnest: Klammern zuerst, dann Punktrechnung (· und :), dann Strichrechnung (+ und −). Es ist $3 + 4 \\cdot 2 = 11$, aber $(3 + 4) \\cdot 2 = 14$.",
            },
            {
              "type": "definition",
              "term": "Vertauschungsgesetz",
              "explanation": "Das **Vertauschungsgesetz** erlaubt beim Addieren und Malnehmen, die Zahlen zu tauschen: $7 \\cdot 4 = 4 \\cdot 7 = 28$.",
            },
            {
              "type": "definition",
              "term": "Verbindungsgesetz",
              "explanation": "Das **Verbindungsgesetz** erlaubt beim Addieren und Malnehmen, anders zusammenzufassen: $(25 \\cdot 4) \\cdot 7 = 25 \\cdot (4 \\cdot 7) = 700$.",
            },
            {
              "type": "definition",
              "term": "Distributivgesetz",
              "explanation": "Das **Distributivgesetz** (Verteilungsgesetz) sagt: Eine Zahl, die mit einer Summe malgenommen wird, darfst du auf jeden Summanden verteilen: $6 \\cdot (7 + 3) = 6 \\cdot 7 + 6 \\cdot 3 = 60$.",
            },
            {
              "type": "example",
              "title": "Vorteilhaft rechnen",
              "blocks":
                [
                  { "type": "formula", "formula": "6 \\cdot 17 + 6 \\cdot 3 = 6 \\cdot (17 + 3) = 6 \\cdot 20 = 120" },
                  {
                    "type": "text",
                    "text": "Die 6 steht in beiden Produkten. Du ziehst sie vor die Klammer und rechnest zuerst die Summe 17 + 3 = 20: Das geht schneller als beide Produkte einzeln.",
                  },
                ],
            },
            {
              "type": "text",
              "text": "**Kannst du das?** Rechne im Kopf oder auf Papier. Unter jeder Aufgabe steht die Lösung mit dem häufigsten Fehler.",
            },
            { "type": "text", "text": "**Aufgabe 1:** Was ergibt $2 + 3 \\cdot 4$?" },
            {
              "type": "note",
              "title": "Lösung 1",
              "blocks":
                [
                  {
                    "type": "text",
                    "text": "**Ergebnis: 14.** Punktrechnung geht vor Strichrechnung: Zuerst 3 · 4 = 12, dann 2 + 12 = 14. Wer 20 hat, ist von links nach rechts gegangen: (2 + 3) · 4.",
                  },
                ],
            },
            {
              "type": "text",
              "text": "**Aufgabe 2:** Was ergibt $6 \\cdot 17 + 6 \\cdot 3$? Tipp: Ziehe die 6 vor die Klammer.",
            },
            {
              "type": "note",
              "title": "Lösung 2",
              "blocks":
                [
                  {
                    "type": "text",
                    "text": "**Ergebnis: 120.** 6 · (17 + 3) = 6 · 20 = 120. Einzeln gerechnet: 102 + 18 = 120.",
                  },
                ],
            },
            {
              "type": "text",
              "text": "Wenn du hier unsicher bist: Lies auf der Lernlandkarte den Baustein „Vorrangregeln und Rechengesetze“: [Kartenseite](https://lernapps.net/apps/map/mathematik/c/grundrechenarten-rechengesetze/). Übe danach die Kurzaufgaben noch einmal.",
            },
          ],
      },
      {
        "type": "section",
        "id": "potenzen",
        "title": "Potenzen und Zehnerpotenzen",
        "blocks":
          [
            {
              "type": "definition",
              "term": "Potenz",
              "explanation": "Eine **Potenz** ist eine Kurzschreibweise für ein Produkt aus gleichen Faktoren: $2^3 = 2 \\cdot 2 \\cdot 2 = 8$.",
            },
            {
              "type": "definition",
              "term": "Basis",
              "explanation": "Die **Basis** einer Potenz ist der Faktor, der sich wiederholt. In $2^3$ ist die Basis 2.",
            },
            {
              "type": "definition",
              "term": "Exponent",
              "explanation": "Der **Exponent** einer Potenz sagt, wie oft die Basis als Faktor vorkommt. In $2^3$ ist der Exponent 3.",
            },
            {
              "type": "definition",
              "term": "Zehnerpotenz",
              "explanation": "Eine **Zehnerpotenz** hat die Basis 10. Sie hat so viele Nullen wie der Exponent: $10^3 = 10 \\cdot 10 \\cdot 10 = 1000$.",
            },
            {
              "type": "example",
              "title": "Potenzen ausrechnen",
              "blocks":
                [
                  { "type": "formula", "formula": "3^2 = 3 \\cdot 3 = 9" },
                  { "type": "formula", "formula": "2^4 = 2 \\cdot 2 \\cdot 2 \\cdot 2 = 16" },
                  {
                    "type": "text",
                    "text": "Der Exponent sagt nicht, womit du malnimmst, sondern wie oft die Basis als Faktor steht: $2^4$ ist nicht $2 \\cdot 4$.",
                  },
                ],
            },
            {
              "type": "text",
              "text": "**Kannst du das?** Rechne im Kopf oder auf Papier. Unter jeder Aufgabe steht die Lösung mit dem häufigsten Fehler.",
            },
            { "type": "text", "text": "**Aufgabe 3:** Was ist $3^2$?" },
            {
              "type": "note",
              "title": "Lösung 3",
              "blocks":
                [
                  {
                    "type": "text",
                    "text": "**Ergebnis: 9.** 3² = 3 · 3 = 9. Wer 6 hat, hat 3 · 2 gerechnet: Der Exponent zählt die Faktoren.",
                  },
                ],
            },
            { "type": "text", "text": "**Aufgabe 4:** Was ist $2^4$?" },
            {
              "type": "note",
              "title": "Lösung 4",
              "blocks":
                [{ "type": "text", "text": "**Ergebnis: 16.** 2 · 2 · 2 · 2 = 16. Wer 8 hat, hat 2 · 4 gerechnet." }],
            },
            {
              "type": "text",
              "text": "Wenn du hier unsicher bist: Lies auf der Lernlandkarte den Baustein „Potenzen und Zehnerpotenzen“: [Kartenseite](https://lernapps.net/apps/map/mathematik/c/potenzen/). Übe danach die Kurzaufgaben noch einmal.",
            },
          ],
      },
      {
        "type": "section",
        "id": "bereit",
        "title": "Du bist bereit, wenn du …",
        "blocks":
          [
            {
              "type": "text",
              "text": "- Klammern und Vorrangregeln beachten und Rechengesetze für vorteilhaftes Rechnen nutzen kannst\n- Potenzen mit natürlichen Exponenten berechnen kannst\n- Basis und Exponent unterscheiden kannst",
            },
          ],
      },
    ],
}
