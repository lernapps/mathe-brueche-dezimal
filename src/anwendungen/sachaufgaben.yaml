            {
              "type": "text",
              "text": "Eine Geschichte beschreibt Mengen, Preise und Anteile. Die Zahlen können Brüche oder Dezimalzahlen sein, oft mit einer Einheit wie Liter, Euro oder Kilometer. Bevor du rechnest, klärst du, was du schon weißt und was du herausfinden möchtest.",
            },
