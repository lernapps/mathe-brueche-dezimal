{
  "title": "Brüche und Dezimalzahlen im Alltag",
  "competencies": ["bruchrechnung-grundaufgaben"],
  "description": "Was ist gegeben und was wird gesucht? Sachaufgaben mit Brüchen, Dezimalzahlen und Einheiten.",
  "scope": "Ordne die Angaben: Ganzes, Bruchteil oder Anteil. Entscheide dann, welche Rechnung die Frage beantwortet. Nenne die Einheit und prüfe durch Schätzen, ob das Ergebnis sinnvoll ist. Beim Vergleichen von Anteilen brauchst du dieselbe Bezugsgröße. 3/4 Liter Saft werden gleich auf zwei Gefäße verteilt: 3/4 : 2 = 3/8 Liter pro Gefäß. Bei 20 Würfen fällt 5-mal eine Sechs: relative Häufigkeit 5/20 = 1/4 = 25 %. Das beschreibt die beobachteten Würfe und keine sichere Vorhersage. Auch mit Dezimalzahlen und Einheiten: Ein Heft kostet 1,60 €, vier Hefte kosten 4 · 1,60 € = 6,40 €. 1,2 Liter auf 4 Gläser: 1,2 : 4 = 0,3 Liter pro Glas. 2,5 Kilometer von 7,8 Kilometern gefahren: 7,8 − 2,5 = 5,3 Kilometer bleiben. Ein Tank mit 40 Litern ist zu 2/5 gefüllt: 40 : 5 · 2 = 16 Liter. Schätze vorher und nenne zum Ergebnis die Einheit.",
