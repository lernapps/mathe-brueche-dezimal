{
  "title": "Prozent heißt Hundertstel",
  "competencies": ["prozent-grundbegriffe"],
  "description": "Wie viel von 100? Bruch, Dezimalzahl und Prozent beschreiben denselben Anteil.",
  "scope": "Prozent heißt Hundertstel: 1 % ist 1/100 vom Ganzen. Ein Anteil lässt sich als Bruch, als Dezimalzahl und in Prozent schreiben, zum Beispiel 3/4 = 75/100 = 0,75 = 75 %. Um einen Bruch in Prozent zu schreiben, erweiterst du ihn auf den Nenner 100; dann steht die Prozentzahl im Zähler. Die Prozentrechnung mit Grundwert, Prozentwert und Prozentsatz gehört nicht zu dieser Seite.",
  "blocks":
    [
      {
        "type": "section",
        "id": "regel",
        "title": "Dein Akku zeigt 75 %",
        "blocks":
          [
            {
              "type": "text",
              "text": "Dein Handy zeigt: Akku 75 %. Stell dir den Akku in 100 gleich große Kästchen geteilt vor, zehn Reihen mit je zehn Kästchen. Dann sind 75 Kästchen gefüllt.",
            },
            {
              "type": "figure",
              "draw": { "kind": "hundred-grid", "filled": 75 },
              "alt": "Ein Hunderterfeld mit 100 Kästchen, zehn Reihen mit je zehn. 75 Kästchen sind gefärbt, 25 sind leer.",
              "caption": "Das Ganze sind 100 Kästchen. Gefärbt sind 75, leer sind 25.",
            },
            {
              "type": "definition",
              "term": "Prozent",
              "explanation": "Ein Kästchen ist ein Hundertstel vom Ganzen, also $\\frac{1}{100}$. Prozent heißt Hundertstel: 75 gefärbte Kästchen sind 75 Hundertstel, also 75 %.",
            },
            {
              "type": "text",
              "text": "So kannst du denselben Anteil auf drei Arten schreiben: als Bruch $\\frac{75}{100}$, als Dezimalzahl 0,75 (zwei Stellen nach dem Komma, wie bei Hundertsteln) und als Prozent 75 %.",
            },
          ],
      },
      {
        "type": "section",
        "id": "entdecken",
        "title": "Anschaulich erklärt: dasselbe Ganze, drei Schreibweisen",
        "blocks":
          [
            {
              "type": "text",
              "text": "Ein Viertel vom Ganzen sind 25 von 100 Kästchen. Du kannst also sagen: Ein Viertel ist $\\frac{25}{100}$, das sind 0,25 oder 25 %. Das ganze Hunderterfeld sind 100 %.",
            },
            {
              "type": "figure",
              "draw": { "kind": "hundred-grid", "filled": 25 },
              "alt": "Ein Hunderterfeld mit 100 Kästchen, 25 davon sind gefärbt: ein Viertel des Ganzen.",
              "caption": "Ein Viertel: 25 von 100 Kästchen sind gefärbt, das sind 25 %.",
            },
            {
              "type": "note",
              "title": "Das Ganze muss feststehen",
              "blocks":
                [
                  {
                    "type": "text",
                    "text": "50 % sind immer die Hälfte vom Ganzen. Aber die Hälfte einer großen Pizza ist mehr als die Hälfte einer kleinen Pizza. Darum musst du immer wissen, was das Ganze ist.",
                  },
                ],
            },
          ],
      },
      {
        "type": "section",
        "id": "beispiel",
        "title": "Am Beispiel nachvollziehen",
        "blocks":
          [
            {
              "type": "example",
              "title": "Vom Bruch zu Prozent und Dezimalzahl",
              "blocks":
                [
                  {
                    "type": "text",
                    "text": "Wie viel Prozent sind $\\frac{3}{5}$? Prozent heißt Hundertstel, also muss im Nenner 100 stehen. Dazu erweiterst du mit 20, denn 5 · 20 = 100:",
                  },
                  { "type": "formula", "formula": "\\frac{3}{5} = \\frac{3 \\cdot 20}{5 \\cdot 20} = \\frac{60}{100}" },
                  {
                    "type": "text",
                    "text": "60 Hundertstel sind 60 %. Als Dezimalzahl schreibst du 0,60, also 0,6: Hundertstel haben zwei Stellen nach dem Komma. Umgekehrt gilt: 8 % sind 8 Hundertstel:",
                  },
                  { "type": "formula", "formula": "8\\,\\% = \\frac{8}{100} = 0{,}08" },
                ],
            },
            {
              "type": "text",
              "text": "So wandelst du die wichtigsten Anteile um. Prüfe bei jeder Zeile, mit welcher Zahl du auf den Nenner 100 erweitern kannst.",
            },
            {
              "type": "table",
              "caption": "Wichtige Anteile in drei Schreibweisen",
              "header": ["Bruch", "Dezimalzahl", "Prozent"],
              "rows":
                [
                  ["$\\frac{1}{2}$", "0,5", "50 %"],
                  ["$\\frac{1}{4}$", "0,25", "25 %"],
                  ["$\\frac{3}{4}$", "0,75", "75 %"],
                  ["$\\frac{1}{10}$", "0,1", "10 %"],
                  ["$\\frac{1}{5}$", "0,2", "20 %"],
