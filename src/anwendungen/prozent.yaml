                    "type": "text",
                    "text": "60 Hundertstel sind 60 %. Als Dezimalzahl schreibst du 0,60, also 0,6. Umgekehrt gilt: 8 % sind 8 Hundertstel:",
                  },
                  { "type": "formula", "formula": "8\\,\\% = \\frac{8}{100} = 0{,}08" },
                ],
