                    "type": "text",
                    "text": "Die Prozentzahl sagt, wie viele von 100 Teilen gemeint sind. Ein halbes Ganzes sind 50 von 100, also 50 %. Das Ganze muss dabei feststehen: Die Hälfte einer großen Pizza ist mehr als die Hälfte einer kleinen, auch wenn beides 50 % sind.",
