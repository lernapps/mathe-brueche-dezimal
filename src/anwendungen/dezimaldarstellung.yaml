{
  "title": "Bruch und Dezimalzahl",
  "competencies": ["dezimalbrueche"],
  "description": "Einen Bruch als Dezimalzahl schreiben, mit Stellenwerttafel, Zahlenstrahl mit Lupe, Erweitern und schriftlichem Teilen.",
  "scope": 'Ein Bruch lässt sich als Dezimalzahl schreiben. Zehntel, Hundertstel und Tausendstel sind die Stellen rechts vom Komma, die Stellenwerttafel zeigt sie, und zehn Hundertstel werden zu einem Zehntel gebündelt. Auf dem Zahlenstrahl von 0 bis 1 vergrößert die Lupe einen Abschnitt auf das Zehnfache. Zwei Wege vom Bruch zur Dezimalzahl, zum Beispiel 3/4 = 75/100 = 0,75 durch Erweitern auf den Nenner 10, 100 oder 1000 und 3/8 = 3 : 8 = 0,375 durch schriftliches Teilen. Brüche, bei denen das Teilen nie endet wie 1/3, gehören zur Seite "periode". Prozent gehört nicht zu dieser Seite.',
  "blocks":
    [
      {
        "type": "section",
        "id": "regel",
        "title": "Ein halber Liter oder 0,5 Liter?",
        "blocks":
          [
            {
              "type": "text",
              "text": "Auf einem Messbecher steht 0,5 Liter. Das ist dieselbe Menge wie ein halber Liter. Stell dir 1 Liter in 10 gleiche Teile geteilt vor. Jedes Teil ist ein **Zehntel**, also $\\frac{1}{10}$. Bei 100 gleichen Teilen heißt jedes ein **Hundertstel** ($\\frac{1}{100}$), bei 1000 ein **Tausendstel** ($\\frac{1}{1000}$). Fünf Zehntel schreibst du als 0,5.",
            },
            {
              "type": "definition",
              "term": "Dezimalzahl",
              "explanation": "Eine Dezimalzahl schreibt Ganze und Teile eines Ganzen nebeneinander. Das Komma trennt die Ganzen von den Teilen. Rechts vom Komma stehen zuerst die Zehntel, dann die Hundertstel, dann die Tausendstel.",
            },
            {
              "type": "text",
              "text": "Jede Ziffer hat einen festen Platz, ihren **Stellenwert**. Die Stellenwerttafel zeigt die Plätze. Links vom Komma steht E für Einer. Rechts vom Komma stehen z für Zehntel, h für Hundertstel und t für Tausendstel. Pass auf: Die kleinen Buchstaben z, h und t sind nicht die großen Z, H und T der ganzen Zahlen (Zehner, Hunderter, Tausender). Zehntel stehen rechts vom Komma, Zehner links davon. Die Ziffern rechts vom Komma heißen Stellen nach dem Komma.",
            },
            {
              "type": "table",
              "caption": "Die Plätze der Stellenwerttafel, hier untereinander, mit den Zahlen 0,375 und 2,408",
              "header": ["Platz", "0,375", "2,408"],
              "rowHeaders": true,
              "rows":
                [
                  ["E Einer", "0", "2"],
                  ["Komma", ",", ","],
                  ["z Zehntel", "3", "4"],
                  ["h Hundertstel", "7", "0"],
                  ["t Tausendstel", "5", "8"],
                ],
            },
            {
              "type": "text",
              "text": "Die erste Zahl liest du so: 0 Einer, 3 Zehntel, 7 Hundertstel und 5 Tausendstel. Sie hat drei Stellen nach dem Komma.",
            },
          ],
      },
      {
