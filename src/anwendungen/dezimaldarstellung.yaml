            {
              "type": "text",
              "text": "Dasselbe zeigt der Zahlenstrahl. Zwischen 0 und 1 liegen die Zehntel, also 0,1 bis 0,9. Eine Lupe vergrößert einen Abschnitt auf das Zehnfache: Aus einem Zehntel-Abschnitt werden zehn Hundertstel-Abschnitte.",
