                  "einer": "E Einer",
                  "zehntel": "z Zehntel",
                  "hundertstel": "h Hundertstel",
                  "tausendstel": "t Tausendstel",
                  "komma": "Komma",
                  "bundleText": "Bündeln",
                  "becomesText": "werden",
                  "resetText": "Neu anfangen",
                  "numberText": "Die Zahl unter der Tafel:",
                },
              "nojs": "Die Stellenwerttafel hat die Spalten E (Einer), Komma, z (Zehntel), h (Hundertstel) und t (Tausendstel). Jedes Plättchen steht für eine Einheit seiner Spalte. Am Anfang liegen 13 Plättchen in der Spalte h. Die Zahl unter der Tafel ist 0,13. Mit „Bündeln“ werden zehn Plättchen einer Spalte zu einem Plättchen der Spalte links davon: 10 h werden 1 z. Danach liegen 1 Plättchen in z und 3 in h. Die Zahl unter der Tafel bleibt 0,13.",
            },
            {
              "type": "note",
              "title": "Was du dabei beobachten kannst",
              "blocks":
