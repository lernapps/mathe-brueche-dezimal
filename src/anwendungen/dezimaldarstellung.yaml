                  {
                    "type": "text",
                    "text": "Zehn Hundertstel sind ein Zehntel, denn $\\frac{10}{100} = \\frac{1}{10}$. Nur die Plättchen wandern, die Zahl bleibt gleich: 13 Hundertstel sind 1 Zehntel und 3 Hundertstel, also 0,13.",
                  },
