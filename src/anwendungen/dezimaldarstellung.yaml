              "text": "Hier liegen 13 Plättchen in der Spalte der Hundertstel. Drücke „Bündeln“: Zehn Hundertstel werden zu einem Zehntel. Die Zahl unter der Tafel zeigt, was gleich bleibt. „Neu anfangen“ legt die Plättchen zurück.",
            },
