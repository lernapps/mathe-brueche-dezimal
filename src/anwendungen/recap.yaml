              "term": "Übertrag",
              "explanation": "Der **Übertrag** ist das, was du dir beim schriftlichen Rechnen für die nächste Stelle merkst. Bei 8 + 5 = 13 schreibst du 3 hin und merkst dir 1 Zehner.",
            },
            {
              "type": "definition",
              "term": "Entbündeln",
              "explanation": "Beim **Entbündeln** tauschst du eine Einheit der nächsthöheren Stelle gegen zehn Einheiten der kleineren Stelle: 1 Hunderter = 10 Zehner. So kannst du beim schriftlichen Subtrahieren auch dann abziehen, wenn oben die kleinere Ziffer steht.",
            },
            {
              "type": "definition",
              "term": "Rest",
              "explanation": "Der **Rest** ist das, was beim Teilen übrig bleibt. Es ist 17 : 5 = 3 Rest 2, denn 3 · 5 = 15 und 17 − 15 = 2.",
