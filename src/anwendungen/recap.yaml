                    "type": "text",
                    "text": "Gleiche Stellen stehen untereinander. Einer: 8 + 5 = 13, du schreibst 3 und merkst dir 1. Zehner: 4 + 7 + 1 = 12, du schreibst 2 und merkst dir 1. Hunderter: 3 + 2 + 1 = 6.",
                  },
                  { "type": "formula", "formula": "348 + 275 = 623" },
