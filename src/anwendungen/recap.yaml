                  {
                    "type": "text",
                    "text": "Oben stehen an der Zehner- und der Hunderterstelle Nullen, dort kannst du nichts abziehen. Du entbündelst von links: 5 Tausender werden 4 Tausender und 10 Hunderter, davon wird 1 Hunderter zu 10 Zehnern, davon 1 Zehner zu 10 Einern. Jetzt stehen oben 4 Tausender, 9 Hunderter, 9 Zehner und 12 Einer.",
                  },
                  {
                    "type": "text",
                    "text": "Einer: 12 − 9 = 3. Zehner: 9 − 8 = 1. Hunderter: 9 − 7 = 2. Tausender: 4 − 1 = 3.",
