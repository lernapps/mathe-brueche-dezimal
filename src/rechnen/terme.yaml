  "description": "Welcher Schritt muss zuerst kommen? Vergleiche Klammern, Punkt vor Strich und das Verteilen.",
  "scope": "Klammern zuerst, dann Punktrechnung vor Strichrechnung. Addition und Multiplikation sind vertauschbar und dürfen umgruppiert werden. Das Distributivgesetz verteilt eine Multiplikation auf eine Summe: a · (b + c) = a · b + a · c. Beim Subtrahieren und Dividieren darfst du die Zahlen nicht vertauschen oder umgruppieren: 8 − 3 ist nicht 3 − 8, und 12 : 4 ist nicht 4 : 12. 1/2 + 1/3 · 3 = 1/2 + 1 = 3/2. Mit Klammern: (1/2 + 1/3) · 3 = 5/6 · 3 = 5/2. Die Klammer verändert die Reihenfolge. Verteilen: 12 · (1/3 + 1/4) = 12 · 1/3 + 12 · 1/4 = 4 + 3 = 7; der Faktor gehört zu jedem Summanden der Klammer. Geschickt umgruppieren: 1/4 + 3/5 + 3/4 = (1/4 + 3/4) + 3/5 = 1 3/5. Ohne Klammer gilt Punkt vor Strich: 1/2 + 2/3 · 3 = 1/2 + 2 = 5/2. Mit Klammer: (1/2 + 2/3) · 3 = 7/6 · 3 = 7/2.",
