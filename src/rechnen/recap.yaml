{
  "title": "Das brauchst du für dieses Kapitel",
  "description": "Klammern, Vorrangregeln und das Distributivgesetz, die du für Rechnungen mit mehreren Schritten brauchst: Kurzwiederholung mit Selbsttest.",
  "recap": "mathematik/grundrechenarten-rechengesetze",
  "scope": "Kurze Wiederholung von Klammern, Vorrangregeln und Distributivgesetz als Voraussetzung für Rechnungen mit Brüchen in mehreren Schritten, mit Selbsttest.",
  "blocks":
    [
      {
        "type": "text",
        "text": "**Wofür ist diese Seite?** Auf der Seite „Rechenregeln und Klammern“ rechnest du Brüche in mehreren Schritten. Dafür brauchst du dieselben Regeln wie bei natürlichen Zahlen. Hier ist die Kurzfassung mit zwei Aufgaben zum Selbsttest.",
      },
      {
        "type": "section",
        "id": "rechengesetze-kurz",
        "title": "Vorrangregeln und Rechengesetze",
        "blocks":
          [
            {
              "type": "example",
              "title": "Kurz erinnert",
              "blocks":
                [
                  {
                    "type": "text",
                    "text": "**Klammern** gehen zuerst. Dann kommt die **Punktrechnung** (Multiplikation und Division, · und :) vor der **Strichrechnung** (Addition und Subtraktion, + und −). Das **Distributivgesetz** verteilt eine Zahl auf die **Summanden** in einer Klammer, das sind die Zahlen, die addiert werden: $4 \\cdot (2 + 3) = 4 \\cdot 2 + 4 \\cdot 3 = 20$. Alle Begriffe stehen mit Erklärung auf der Seite „Das brauchst du für dieses Kapitel“ im Kapitel „Teilbarkeit nutzen“.",
                  },
                ],
            },
            {
              "type": "text",
              "text": "**Kannst du das?** Rechne im Kopf oder auf Papier und wähle dann eine Antwort. Du siehst sofort, ob sie stimmt und warum.",
            },
            {
              "type": "vue-component",
              "id": "test-klammer",
              "component": "Kurztest",
              "props":
                {
                  "question": "Was ergibt (2 + 3) · 4?",
                  "options":
                    [
                      {
                        "text": "14",
                        "correct": false,
                        "info": "Du hast die Klammer übersehen: 2 + 3 · 4 = 14. Hier geht die Klammer zuerst.",
                      },
                      { "text": "20", "correct": true, "info": "Die Klammer geht zuerst: 2 + 3 = 5, dann 5 · 4 = 20." },
                      {
                        "text": "12",
                        "correct": false,
                        "info": "Du hast nur 3 · 4 gerechnet. Die Klammer fasst 2 + 3 zusammen.",
                      },
                    ],
                  "right": "Richtig.",
                  "wrong": "Nicht richtig.",
                },
              "nojs": "Kurztest: Was ergibt (2 + 3) · 4? Antworten: 14; 20; 12. Richtig ist 20. Die Klammer geht zuerst: 2 + 3 = 5, dann 5 · 4 = 20. Falsche Antworten: 14: Du hast die Klammer übersehen: 2 + 3 · 4 = 14. Hier geht die Klammer zuerst. 12: Du hast nur 3 · 4 gerechnet. Die Klammer fasst 2 + 3 zusammen.",
            },
            {
              "type": "vue-component",
              "id": "test-verteilen-2",
              "component": "Kurztest",
              "props":
                {
                  "question": "Was ergibt 5 · (3 + 4), wenn du die 5 auf beide Summanden verteilst?",
                  "options":
                    [
                      {
                        "text": "19",
                        "correct": false,
                        "info": "Du hast nur 3 mit 5 multipliziert: 5 · 3 + 4. Die 5 gehört zu beiden Summanden.",
                      },
                      { "text": "35", "correct": true, "info": "5 · 3 + 5 · 4 = 15 + 20 = 35." },
                      { "text": "20", "correct": false, "info": "Das ist nur 5 · 4. Es fehlt noch 5 · 3 = 15." },
                    ],
                  "right": "Richtig.",
                  "wrong": "Nicht richtig.",
                },
              "nojs": "Kurztest: Was ergibt 5 · (3 + 4), wenn du die 5 auf beide Summanden verteilst? Antworten: 19; 35; 20. Richtig ist 35. 5 · 3 + 5 · 4 = 15 + 20 = 35. Falsche Antworten: 19: Du hast nur 3 mit 5 multipliziert: 5 · 3 + 4. Die 5 gehört zu beiden Summanden. 20: Das ist nur 5 · 4. Es fehlt noch 5 · 3 = 15.",
            },
            {
              "type": "text",
              "text": "Wenn du dir bei einer Aufgabe unsicher bist: Lies den Baustein „Vorrangregeln und Rechengesetze“ auf der Lernlandkarte ([Lernlandkarte: Vorrangregeln und Rechengesetze](https://lernapps.net/apps/map/mathematik/c/grundrechenarten-rechengesetze/)) und rechne die Aufgaben danach noch einmal.",
            },
          ],
