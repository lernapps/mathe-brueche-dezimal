{
  "title": "Addieren und subtrahieren",
  "competencies": ["brueche-addieren-subtrahieren"],
  "description": "Halbe und drittel Stücke zusammenzählen oder wegnehmen: erst gleich groß machen, dann rechnen.",
  "scope": "Zum Addieren oder Subtrahieren brauchst du gleich große Bruchstücke. Bei verschiedenen Nennern bringst du beide Brüche auf den kleinsten gemeinsamen Nenner, das ist das kgV der Nenner. Dann rechnest du nur mit den Zählern, der Nenner bleibt. Zähler und Nenner dürfen nie einzeln addiert oder subtrahiert werden: 1/2 + 1/3 ist nicht 2/5. Danach kürzt du das Ergebnis vollständig. Ist die Summe größer als 1, schreibst du sie als unechten Bruch oder als gemischte Zahl. Beispiele: 1/2 + 1/3 = 3/6 + 2/6 = 5/6. 3/4 − 1/6 = 9/12 − 2/12 = 7/12. 3/4 + 5/6 = 9/12 + 10/12 = 19/12 = 1 7/12. Mit dem Produkt der Nenner statt dem kgV rechnest du auch richtig, musst dann aber mehr kürzen: 1/4 + 1/6 = 6/24 + 4/24 = 10/24 = 5/12.",
