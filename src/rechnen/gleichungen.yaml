  "scope": "Bei einer Gleichung soll links und rechts derselbe Wert stehen. Finde die fehlende Zahl mit der Umkehrrechnung (Plus und Minus heben sich auf, Mal und Geteilt auch) und setze sie zur Probe ein. Ein fehlender Summand entsteht durch Subtraktion, ein fehlender Faktor durch Division. x + 1/4 = 3/4. Also x = 3/4 − 1/4 = 2/4 = 1/2. Probe: 1/2 + 1/4 = 3/4. Ein fehlender Faktor: x · 3/8 = 3/4, also x = 3/4 : 3/8 = 3/4 · 8/3 = 2. Probe: 2 · 3/8 = 3/4. Mit verschiedenen Nennern: x + 1/6 = 3/4, also x = 3/4 − 1/6 = 9/12 − 2/12 = 7/12.",
