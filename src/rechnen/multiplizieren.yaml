{
  "title": "Brüche multiplizieren",
  "competencies": ["brueche-multiplizieren-dividieren"],
  "description": "Kuchenstücke weiter teilen oder ein Rechteck bilden: zwei Bilder für dieselbe Multiplikation.",
  "scope": "Brüche multiplizieren lässt sich auf zwei Arten vorstellen. Kuchenmodell: Drei Viertel eines Kuchens sind ausgewählt. Jedes ausgewählte Viertel wird in drei gleich große Stücke geteilt; davon werden jeweils zwei genommen. Das ergibt sechs von zwölf Stücken des ganzen Kuchens: 2/3 · 3/4 = 6/12 = 1/2. Rechteckmodell: Ein Einheitsquadrat steht für eine Flächeneinheit. Ein Rechteck mit Breite 3/4 und Höhe 2/3 umfasst sechs von zwölf gleich großen Teilflächen des Einheitsquadrats und hat die Fläche 1/2. In beiden Modellen werden Zähler und Nenner multipliziert. Gemeinsame Faktoren dürfen vor dem Multiplizieren gekürzt werden. Bei einem positiven Faktor zwischen 0 und 1 wird eine positive Zahl kleiner. Mal eine natürliche Zahl: 3 · 2/5 = 2/5 + 2/5 + 2/5 = 6/5 = 1 1/5; die natürliche Zahl ist ein Bruch mit Nenner 1, nur der Zähler wird mit ihr multipliziert. Kürzen vor dem Multiplizieren: 4/9 · 3/8 = (4 : 4)/(9 : 3) · (3 : 3)/(8 : 4) = 1/3 · 1/2 = 1/6; gekürzt wird ein Zähler mit einem Nenner, nie zwei Zähler oder zwei Nenner. Das Ergebnis ist vollständig gekürzt anzugeben.",
