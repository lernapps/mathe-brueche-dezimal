                    "text": "Kuchen: Von jedem der drei Viertelstücke werden zwei von drei Stückchen genommen. Das sind 3 · 2 = 6 Stückchen. Der ganze Kuchen hätte 4 · 3 = 12 solcher Stückchen. Rechteck: Drei von vier Spalten und zwei von drei Zeilen bilden ein Rechteck aus 3 · 2 = 6 von insgesamt 4 · 3 = 12 Feldern. Beide Bilder zeigen $\\frac{2}{3} \\cdot \\frac{3}{4} = \\frac{6}{12} = \\frac{1}{2}$. So wird verständlich, warum du Zähler mit Zähler und Nenner mit Nenner multiplizierst.",
