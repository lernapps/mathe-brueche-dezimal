                    "nojs": "Stell dir einen Kuchen vor, der in vier gleich große Stücke geteilt ist. Drei Stücke gehören dir: $\\frac{3}{4}$ des Kuchens. Davon möchtest du zwei Drittel nehmen. Schneide JEDES deiner drei Stücke in drei gleich große Stückchen und nimm jeweils zwei davon. Achte auf das Ganze: Der Ergebnisbruch bezieht sich weiterhin auf den ganzen Kuchen, nicht nur auf deine drei Stücke. Im rechten Bild sind nur die genommenen Stückchen gefüllt; dicke Linien zeigen die ursprünglichen Viertel. Verändere die Regler und beobachte, wie viel von deinen drei Vierteln übrig bleibt.\n\nZu Beginn bleiben drei von drei Stückchen pro Viertel ausgewählt: neun von zwölf Stückchen, weiterhin $\\frac{3}{4}$ des ganzen Kuchens. Nimmst du danach nur zwei von drei Stückchen pro Viertel, sind sechs von zwölf Stückchen des ganzen Kuchens ausgewählt. $\\frac{2}{3} \\cdot \\frac{3}{4} = \\frac{6}{12} = \\frac{1}{2}$.",
