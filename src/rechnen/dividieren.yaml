  "description": "Wie viele Achtelstücke passen in drei Viertel? Und was heißt geteilt durch 2?",
  "scope": "Division kann fragen: Wie oft passt der Divisor in den Dividenden? Zum Dividieren durch einen Bruch multiplizierst du mit seinem Kehrbruch. Nur der **zweite** Bruch, der Divisor, wird umgekehrt; der Dividend bleibt. Durch 0 darfst du nicht teilen. 3/4 sind 6/8. Daher passen sechs Achtel in drei Viertel: 3/4 : 1/8 = 3/4 · 8/1 = 6. Durch eine natürliche Zahl teilen: Die Zahl ist ein Bruch mit Nenner 1, ihr Kehrbruch ist 1 durch die Zahl. 3/4 : 2 = 3/4 · 1/2 = 3/8. Der Nenner wird mit der Zahl multipliziert. Durch einen Bruch mit größerem Zähler teilen: 3/4 : 3/8 = 3/4 · 8/3 = 24/12 = 2; zwei Stücke der Größe 3/8 passen in 3/4. Dividend und Divisor dürfen nicht vertauscht werden: 3/8 : 3/4 = 1/2, nicht 2. Das Ergebnis ist vollständig gekürzt anzugeben.",
