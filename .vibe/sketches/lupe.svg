<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" font-family="sans-serif" font-size="14">
<title>Skizze Zahlenstrahl mit Lupe</title><desc>Zahlenstrahl von 0 bis 1 in Zehntel; ein Abschnitt zwischen 0,3 und 0,4 ist darunter vergrößert und in Hundertstel geteilt.</desc>
<line x1="30" y1="110" x2="490" y2="110" stroke="#333"/><line x1="30" y1="110" x2="30" y2="130" stroke="#333"/><line x1="76" y1="110" x2="76" y2="120" stroke="#333"/><line x1="122" y1="110" x2="122" y2="120" stroke="#333"/><line x1="168" y1="110" x2="168" y2="120" stroke="#333"/><line x1="214" y1="110" x2="214" y2="120" stroke="#333"/><line x1="260" y1="110" x2="260" y2="120" stroke="#333"/><line x1="306" y1="110" x2="306" y2="120" stroke="#333"/><line x1="352" y1="110" x2="352" y2="120" stroke="#333"/><line x1="398" y1="110" x2="398" y2="120" stroke="#333"/><line x1="444" y1="110" x2="444" y2="120" stroke="#333"/><line x1="490" y1="110" x2="490" y2="130" stroke="#333"/>
<text x="24" y="150">0</text><text x="478" y="150">1</text><text x="154" y="150">0,3</text><text x="200" y="150">0,4</text>
<rect x="144" y="100" width="46" height="20" fill="none" stroke="#16765d" stroke-width="2"/>
<path d="M144 120L40 190M190 120L480 190" stroke="#16765d" fill="none"/>
<line x1="40" y1="200" x2="480" y2="200" stroke="#333"/><text x="30" y="230">0,3</text><text x="465" y="230">0,4</text>
<text x="170" y="60">Lupe: Regler oder Pfeiltasten wählen den Abschnitt</text></svg>